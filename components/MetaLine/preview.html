<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MetaLine — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }

  .ph { display: grid; justify-items: center; gap: var(--space-4); padding: var(--space-6) 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h('div', null, cap('card'),
        h(A.MetaLine, { items: [{ label: 'October 18, 2026', dateTime: '2026-10-18' }, '4 min read', { label: 'Platform team', href: '#' }] })),
      h('div', null, cap('with an update'),
        h(A.MetaLine, { items: [{ label: 'Updated October 20, 2026', dateTime: '2026-10-20', icon: 'clock' }, '6 min read'] })),
      h('div', { className: 'ph' },
        h(A.Badge, null, 'Retired'),
        h(A.MetaLine, { align: 'center', items: [{ label: 'September 29, 2026', dateTime: '2026-09-29' }, '3 min read'] }))));
</script>
</body>
</html>
