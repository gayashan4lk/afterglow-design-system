<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h('div', null, cap('md · 40px'),
        h('div', { className: 'row' },
          h(A.Button, { variant: 'primary' }, 'Get started'),
          h(A.Button, null, "What's new"),
          h(A.Button, { variant: 'ghost', iconStart: 'rss' }, 'Subscribe'),
          h(A.Button, { iconEnd: 'arrow-right' }, 'All posts'),
          h(A.Button, { disabled: true }, 'Disabled'))),
      h('div', null, cap('sm · 32px'),
        h('div', { className: 'row' },
          h(A.Button, { variant: 'primary', size: 'sm' }, 'Subscribe'),
          h(A.Button, { size: 'sm', iconStart: 'copy' }, 'Copy link'),
          h(A.Button, { variant: 'ghost', size: 'sm', href: '#', iconEnd: 'arrow-up-right' }, 'View docs')))));
</script>
</body>
</html>
