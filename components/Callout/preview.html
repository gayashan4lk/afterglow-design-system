<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Callout — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-8); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-3); }
  .narrow { width: 375px; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
</style>

<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  var NAV = [{ label: 'Changelog', href: '#', current: true }, { label: 'Docs', href: '#' }, { label: 'Stories', href: '#' }];
  mount(h('div', { style: { display: 'grid', gap: 'var(--space-4)', maxWidth: '680px' } },
    h(A.Callout, { type: 'note' }, 'Existing tokens keep working until they reach their expiry date.'),
    h(A.Callout, { type: 'tip' }, 'Rotate tokens from a scheduled CI job instead of minting long-lived ones.'),
    h(A.Callout, { type: 'important' }, 'Granular tokens can no longer bypass two-factor authentication.'),
    h(A.Callout, { type: 'warning' }, 'Classic tokens stop working on November 19. Migrate before then.'),
    h(A.Callout, { type: 'caution' }, ['Deleting a token can\u2019t be undone. ', h('a', { key: 'a', href: '#' }, 'Check where it is used'), ' first.'])));
</script>
