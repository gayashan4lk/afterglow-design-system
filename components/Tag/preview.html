<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tag — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function Filters() {
    var cats = [['All', null, 42], ['Security', 'red', 9], ['Releases', 'green', 17], ['Guides', 'blue', 8], ['Community', 'purple', 5], ['Deprecations', 'orange', 3]];
    var s = React.useState('All'), cur = s[0], set = s[1];
    return h('div', { className: 'row', role: 'group', 'aria-label': 'Filter posts' }, cats.map(function (c) {
      return h(A.Tag, { key: c[0], hue: c[1] || undefined, count: c[2], selected: cur === c[0], onClick: function () { set(c[0]); } }, c[0]);
    }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h('div', null, cap('filter chips'), h(Filters)),
      h('div', null, cap('links · plain'),
        h('div', { className: 'row' },
          h(A.Tag, { hue: 'red', href: '#' }, 'Security'),
          h(A.Tag, { hue: 'green', href: '#' }, 'Releases'),
          h(A.Tag, null, 'TypeScript'),
          h(A.Tag, null, 'CI/CD')))));
</script>
</body>
</html>
