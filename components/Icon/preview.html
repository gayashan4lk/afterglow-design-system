<!-- @dsCard group="Primitives" height=400 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: var(--space-2); }
  .cell { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); color: var(--ink); border-radius: var(--radius-md); }
  .cell span { font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sizes { display: flex; align-items: end; gap: var(--space-4); color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h('div', null, cap('16 · 20 · 24'),
        h('div', { className: 'sizes' }, h(A.Icon, { name: 'search', size: 16 }), h(A.Icon, { name: 'search', size: 20 }), h(A.Icon, { name: 'search', size: 24 }))),
      h('div', null, cap('the set · ' + A.ICON_NAMES.length + ' icons'),
        h('div', { className: 'grid' }, A.ICON_NAMES.map(function (n) {
          return h('div', { key: n, className: 'cell' }, h(A.Icon, { name: n, size: 20 }), h('span', null, n));
        })))));
</script>
</body>
</html>
