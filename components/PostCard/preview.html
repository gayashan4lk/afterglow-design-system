<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PostCard — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-8); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-3); }
  .narrow { width: 375px; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }

  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-8); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  var NAV = [{ label: 'Changelog', href: '#', current: true }, { label: 'Docs', href: '#' }, { label: 'Stories', href: '#' }];
  var POSTS = [
    { href: '#', title: 'Faster releases: what changed in our publishing pipeline', excerpt: 'We cut median publish time from four minutes to forty seconds. Here is how the new pipeline works and what it means for your builds.', date: { label: 'October 14, 2026', dateTime: '2026-10-14' }, readingTime: '6 min read', category: { label: 'Releases', hue: 'green' }, authors: [{ name: 'Lena Hart' }, { name: 'Tom\u00e1s Ortega' }] },
    { href: '#', title: 'Stronger publishing security: changes to tokens and sign-in', excerpt: 'Write tokens now expire after seven days by default.', date: { label: 'September 29, 2026', dateTime: '2026-09-29' }, readingTime: '3 min read', category: { label: 'Security', hue: 'red' }, badge: 'Retired' },
    { href: '#', title: 'A field guide to our new search syntax', excerpt: 'Filters, ranges and saved queries, with examples you can paste.', date: { label: 'September 18, 2026', dateTime: '2026-09-18' }, readingTime: '8 min read', category: { label: 'Guides', hue: 'blue' } },
    { href: '#', title: 'What we learned running a public roadmap for a year', excerpt: 'Votes, surprises and the features we shipped because you asked.', date: { label: 'September 2, 2026', dateTime: '2026-09-02' }, readingTime: '5 min read', category: { label: 'Community', hue: 'purple' } },
    { href: '#', title: 'Classic tokens are deprecated', excerpt: 'They stop working on November 19. Migrate to granular tokens before then.', date: { label: 'August 21, 2026', dateTime: '2026-08-21' }, readingTime: '2 min read', category: { label: 'Deprecations', hue: 'orange' }, badge: 'Deprecated' }];

  mount(h('div', { className: 'stack' },
    h('div', null, cap('featured'), h(A.PostCard, { post: POSTS[0], variant: 'featured' })),
    h('div', null, cap('default · with art and without'),
      h('div', { className: 'two' }, h(A.PostCard, { post: POSTS[2], art: true }), h(A.PostCard, { post: POSTS[1] }))),
    h('div', null, cap('row · changelog'),
      h('div', { style: { borderTop: '1px solid var(--line)' } }, h(A.PostCard, { post: POSTS[1], variant: 'row' }), h(A.PostCard, { post: POSTS[4], variant: 'row' })))));
</script>
</body>
</html>
