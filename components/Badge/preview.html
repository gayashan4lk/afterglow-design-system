<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Badge — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h('div', null, cap('accent (default, follows the page)'),
        h('div', { className: 'row' }, h(A.Badge, null, 'Retired'), h(A.Badge, { icon: 'triangle-alert' }, 'Breaking'))),
      h('div', null, cap('pinned hues · neutral'),
        h('div', { className: 'row' },
          h(A.Badge, { hue: 'green' }, 'New'),
          h(A.Badge, { hue: 'blue' }, 'Updated'),
          h(A.Badge, { hue: 'purple' }, 'Beta'),
          h(A.Badge, { hue: 'orange' }, 'Deprecated'),
          h(A.Badge, { hue: 'red' }, 'Security'),
          h(A.Badge, { hue: 'neutral' }, 'Draft')))));
</script>
</body>
</html>
