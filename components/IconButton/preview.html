<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IconButton — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-6); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-2); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function Theme() {
    var s = React.useState(true), dark = s[0], set = s[1];
    return h(A.IconButton, { icon: dark ? 'moon' : 'sun', label: dark ? 'Switch to light theme' : 'Switch to dark theme', pressed: dark, onClick: function () { set(!dark); } });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'stack' },
      h('div', null, cap('ghost · md'),
        h('div', { className: 'row' },
          h(A.IconButton, { icon: 'search', label: 'Search' }),
          h(A.IconButton, { icon: 'menu', label: 'Open menu' }),
          h(Theme),
          h(A.IconButton, { icon: 'rss', label: 'RSS feed', href: '#' }))),
      h('div', null, cap('secondary · sm'),
        h('div', { className: 'row' },
          h(A.IconButton, { icon: 'link', label: 'Copy link to this post', variant: 'secondary', size: 'sm' }),
          h(A.IconButton, { icon: 'share-2', label: 'Share', variant: 'secondary', size: 'sm' }),
          h(A.IconButton, { icon: 'x', label: 'Close', variant: 'secondary', size: 'sm' })))));
</script>
</body>
</html>
