<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Afterglow</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; width:480px; height:288px; }
  .glow { fill:var(--accent-glow); }
  .arc { fill:var(--accent); }
  .spark { fill:var(--ink); }
  .dot { fill:var(--line-strong); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:600; letter-spacing:-0.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 3px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">

  scales      pitch space-8 (32px); dot diameter space-1; inset space-4; discs are radius-full shapes (r = half the width)
