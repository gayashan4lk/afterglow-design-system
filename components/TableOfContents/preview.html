<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TableOfContents — preview</title>
<style>
  body { padding: var(--space-6); }
  .stack { display: grid; gap: var(--space-8); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-3); }
  .narrow { width: 375px; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }

  .two { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: var(--space-12); align-items: start; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function cap(t) { return h('p', { className: 'cap' }, t); }
  function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  var NAV = [{ label: 'Changelog', href: '#', current: true }, { label: 'Docs', href: '#' }, { label: 'Stories', href: '#' }];
  var ITEMS = [
    { id: 'changing', label: "What's changing" },
    { id: 'lifetimes', label: 'Shorter token lifetimes', level: 3 },
    { id: 'timeline', label: 'Timeline and rollout' },
    { id: 'ahead', label: 'Looking ahead' },
    { id: 'todo', label: 'What you need to do' },
    { id: 'help', label: 'Getting help' }];
  function Rail() {
    var s = React.useState('timeline'), cur = s[0], set = s[1];
    return h('div', { onClickCapture: function (e) { var a = e.target.closest('a'); if (a) { e.preventDefault(); set(a.getAttribute('href').slice(1)); } } },
      h(A.TableOfContents, { items: ITEMS, mode: 'rail', sticky: false, activeId: cur }));
  }
  function Collapsed() {
    return h('div', { onClickCapture: function (e) { if (e.target.closest('a')) e.preventDefault(); } },
      h(A.TableOfContents, { items: ITEMS, mode: 'collapsible', sticky: false, activeId: 'timeline' }));
  }
  mount(h('div', { className: 'two' },
    h('div', null, cap('rail · click an item'), h(Rail)),
    h('div', null, cap('collapsible · below 1100px'), h(Collapsed))));
  setTimeout(function () { var b = document.querySelector('.ag-toc--collapsible .ag-toc__toggle'); if (b) b.click(); }, 60);
</script>
</body>
</html>
