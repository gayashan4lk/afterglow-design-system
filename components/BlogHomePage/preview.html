<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlogHomePage — preview</title>
<style>
  body { margin: 0; }
  .cap { font-family: var(--font-mono); font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 var(--space-3); }

  .intro { display: grid; gap: var(--space-8); align-items: end; padding-top: var(--space-24); padding-bottom: var(--space-12); }
  .intro__title { margin: 0; color: var(--ink); }
  .intro__lead { margin: var(--space-4) 0 0; max-width: var(--measure); color: var(--ink-body); }
  .intro__search .ag-search { max-width: none; }
  @media (min-width: 768px) { .intro { grid-template-columns: minmax(0, 1fr) 360px; } }
  .filters { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-8); }
  .pages { margin-top: var(--space-16); padding-top: var(--space-6); border-top: 1px solid var(--line); }
  .news { padding-top: var(--space-16); padding-bottom: var(--space-24); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var A = window.Afterglow, h = React.createElement;
  function mount(el) { ReactDOM.createRoot(document.getElementById('root')).render(el); }
  function noNav(e) { var a = e.target.closest && e.target.closest('a[href^="#"]'); if (a && a.getAttribute('href').length > 1 && !document.getElementById(a.getAttribute('href').slice(1))) e.preventDefault(); }
  var FOOTER = {
    siteName: 'Signal', tagline: 'Notes from the team building Signal: releases, deep dives and the occasional retrospective.',
    columns: [
      { title: 'Blog', links: [{ label: 'Changelog', href: '#' }, { label: 'Engineering', href: '#' }, { label: 'Security', href: '#' }, { label: 'Community', href: '#' }] },
      { title: 'Product', links: [{ label: 'Docs', href: '#' }, { label: 'Pricing', href: '#' }, { label: 'Status', href: '#' }] },
      { title: 'Company', links: [{ label: 'About', href: '#' }, { label: 'Careers', href: '#' }, { label: 'Contact', href: '#' }] }],
    legal: '© 2026 Signal Labs', bottomLinks: [{ label: 'Privacy', href: '#' }, { label: 'Terms', href: '#' }], rssHref: '#' };
  function header(current) {
    return h(A.SiteHeader, { siteName: 'Signal', section: 'Blog', sticky: true, onSearch: function () {},
      nav: [{ label: 'Blog', href: '#', current: current === 'blog' }, { label: 'Changelog', href: '#', current: current === 'changelog' }, { label: 'Docs', href: '#' }],
      secondaryAction: { label: "What's new", href: '#' }, primaryAction: { label: 'Get started', href: '#' } });
  }
  var POSTS = [
    { href: '#', title: 'Faster releases: what changed in our publishing pipeline', excerpt: 'We cut median publish time from four minutes to forty seconds. Here is how the new pipeline works and what it means for your builds.', date: { label: 'October 14, 2026', dateTime: '2026-10-14' }, readingTime: '6 min read', category: { label: 'Releases', hue: 'green' }, authors: [{ name: 'Lena Hart' }, { name: 'Tomás Ortega' }] },
    { href: '#', title: 'Stronger publishing security: changes to tokens and sign-in', excerpt: 'Write tokens now expire after seven days by default.', date: { label: 'September 29, 2026', dateTime: '2026-09-29' }, readingTime: '3 min read', category: { label: 'Security', hue: 'red' }, badge: 'Retired' },
    { href: '#', title: 'A field guide to our new search syntax', excerpt: 'Filters, ranges and saved queries, with examples you can paste.', date: { label: 'September 18, 2026', dateTime: '2026-09-18' }, readingTime: '8 min read', category: { label: 'Guides', hue: 'blue' } },
    { href: '#', title: 'What we learned running a public roadmap for a year', excerpt: 'Votes, surprises and the features we shipped because you asked.', date: { label: 'September 2, 2026', dateTime: '2026-09-02' }, readingTime: '5 min read', category: { label: 'Community', hue: 'purple' } },
    { href: '#', title: 'Classic tokens are deprecated', excerpt: 'They stop working on November 19. Migrate to granular tokens before then.', date: { label: 'August 21, 2026', dateTime: '2026-08-21' }, readingTime: '2 min read', category: { label: 'Deprecations', hue: 'orange' }, badge: 'Deprecated' },
    { href: '#', title: 'Inside the cache: how we made cold starts 3× faster', excerpt: 'A tour of the layered cache behind every build, and the bug that took a week to find.', date: { label: 'August 12, 2026', dateTime: '2026-08-12' }, readingTime: '11 min read', category: { label: 'Engineering', hue: 'blue' } },
    { href: '#', title: 'Two-factor is now required for every publisher', excerpt: 'Why we made it mandatory, and how to set it up in under a minute.', date: { label: 'July 30, 2026', dateTime: '2026-07-30' }, readingTime: '4 min read', category: { label: 'Security', hue: 'red' }, badge: 'New' }];
  function Home() {
    var cats = [['All', null], ['Releases', 'green'], ['Security', 'red'], ['Engineering', 'blue'], ['Guides', 'blue'], ['Community', 'purple'], ['Deprecations', 'orange']];
    var s = React.useState('All'), cur = s[0], set = s[1];
    var p = React.useState(1), page = p[0], setPage = p[1];
    return h('div', { onClickCapture: noNav },
      header('blog'),
      h('main', { id: 'main' },
        h(A.Container, { className: 'intro' },
          h('div', { className: 'intro__text' },
            h('h1', { className: 'display intro__title' }, 'Signal blog'),
            h('p', { className: 'lead intro__lead' }, 'Releases, deep dives and lessons from the team building Signal.')),
          h('div', { className: 'intro__search' }, h(A.SearchField, null))),
        h(A.Container, null,
          h('div', { className: 'filters', role: 'group', 'aria-label': 'Filter by category' }, cats.map(function (c) {
            return h(A.Tag, { key: c[0], hue: c[1] || undefined, selected: cur === c[0], onClick: function () { set(c[0]); } }, c[0]);
          })),
          h(A.PostGrid, null,
            h(A.PostCard, { post: POSTS[0], variant: 'featured', headingLevel: 2 }),
            POSTS.slice(1).map(function (post, i) { return h(A.PostCard, { key: i, post: post, headingLevel: 2 }); })),
          h('div', { className: 'pages' }, h(A.Pagination, { page: page, pageCount: 9, onPageChange: setPage }))),
        h(A.Container, { width: 'wide', className: 'news' }, h(A.NewsletterSignup, { finePrint: 'One email when we publish, about twice a month. Unsubscribe any time.' }))),
      h(A.SiteFooter, FOOTER));
  }
  mount(h(Home));
</script>
</body>
</html>
